name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive and SHA-256
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="Agent-Run-Lens-${GITHUB_REF_NAME}/" HEAD -o "dist/Agent-Run-Lens-${GITHUB_REF_NAME}.zip"
          cd dist
          sha256sum "Agent-Run-Lens-${GITHUB_REF_NAME}.zip" > "Agent-Run-Lens-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
